<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steven Picknwear — Coming Soon</title>
  <link rel="icon" href="logo.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 600px;
    }
    .logo {
      display: inline-block;
      background: #ffffff;
      border-radius: 16px;
      padding: 18px 24px;
      margin-bottom: 28px;
    }
    .logo img { width: min(360px, 70vw); height: auto; display: block; }
    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #f5a623, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.2rem;
      color: #cccccc;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 10px 25px;
      border: 2px solid #f5a623;
      border-radius: 50px;
      color: #f5a623;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><img src="logo.png" alt="Steven Picknwear: The International Brand Outlet"></div>
    <h1>Steven Picknwear</h1>
    <p>Our online store is on its way: suits, denim and occasion wear for women, men and kids.</p>
    <div class="badge">Coming Soon</div>
  </div>
</body>
</html>
